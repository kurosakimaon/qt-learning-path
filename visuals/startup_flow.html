        <rect class="svg-field" x="30" y="160" width="680" height="200" rx="10"/>
        <text class="svg-small" x="50" y="188">接下来是纯 C++ 的析构，要注意顺序（后声明的先销毁）：</text>

    caption: '关掉最后一个窗口，默认会触发 <code>quit()</code>，<code>exec()</code> 返回。之后的析构是<strong>纯 C++</strong>：后声明的先销毁。<strong>控件对象不能晚于 QApplication 存在</strong>——否则它析构时还要访问已经拆掉的平台层。所以 <code>QApplication</code> 写在 <code>main</code> 的最前面、控件写在它后面。',
